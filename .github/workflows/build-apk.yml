# Free APK builds on GitHub Actions — no PC needed beyond a browser.
#
# Debug APK (every push + every PR):
#   1. Put this project in a GitHub repo (upload the files).
#   2. Open the repo on github.com -> Actions tab -> pick a "Build APKs" run.
#   3. Download "app-debug-apk" from the run's Artifacts.
#   4. Install on your phone (allow "Install unknown apps").
#
# Signed release APK (push to main, or manual "Run workflow"):
#   Needs the four repo secrets below (Settings -> Secrets and variables ->
#   Actions -> New repository secret). See README.md "Signed release build".
#     KEYSTORE_BASE64   - base64 of keystore/upload-keystore.jks
#     KEYSTORE_PASSWORD - the keystore password
#     KEY_ALIAS         - key alias (this project's alias is "upload")
#     KEY_PASSWORD      - the key password (same as keystore password here)
name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate SFX assets (deterministic, CC0)
        run: |
          pip install numpy scipy
          python3 tools/gen_sfx.py

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Signed release APK
    # Secrets are only available on pushes to this repo / manual runs,
    # never on PRs from forks — so this job stays off the pull_request trigger.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMGR=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.0

      - name: Restore upload keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/upload-keystore.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate SFX assets (deterministic, CC0)
        run: |
          pip install numpy scipy
          python3 tools/gen_sfx.py

      - name: Build signed release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
